fragment Dataset on DatasetNode {
    id
    name
    path
    description
    createdAt
    legacy
    analysisCount
    spectrogramCount
    start
    end
    archived
}

query allDatasets($archived: Boolean) {
    allDatasets(
        orderBy: "name",
        archived: $archived
    ) {
        results {
            id
            name
        }
    }
}

query allDatasetsWithCampaigns {
    allDatasets(orderBy: "-createdAt") {
        results {
            ...Dataset
            annotationCampaigns {
                edges {
                    node {
                        id
                        name
                        archived
                    }
                }
            }
        }
    }
}

query getDatasetByID($id: ID!) {
    datasetById(id: $id) {
        ...Dataset
        owner {
            displayName
        }
    }
    allChannelConfigurations(datasetId: $id) {
        results {
            deployment {
                name
                campaign {
                    name
                }
                site {
                    name
                }
                project {
                    name
                }
            }
            recorderSpecification {
                recorder {
                    serialNumber
                    model {
                        name
                    }
                }
                hydrophone {
                    serialNumber
                    model {
                        name
                    }
                }
            }
            detectorSpecification {
                detector {
                    serialNumber
                    model {
                        name
                    }
                }
            }
        }
    }
    allSpectrogramAnalysis(
        orderBy: "-createdAt"
        dataset: $id
    ) {
        results { ...SpectrogramAnalysis }
    }
    allAnnotationCampaigns(
        analysis_DatasetId: $id
        orderBy: "name"
    ) {
        results { ...BaseCampaign }
    }
}
