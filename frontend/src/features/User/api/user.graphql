# Current user

fragment CurrentUser on UserNode {
    id
    displayName
    isAdmin
    isSuperuser
    username
    email
}

query getCurrentUser {
    currentUser { ...CurrentUser }
}


# List users

fragment User on UserNode {
    __typename
    id
    displayName
    username
    expertise
}

query allUsers {
    allUsers { results { __typename, ...User } }
}


# List user groups

fragment UserGroup on UserGroupNode {
    __typename
    id
    name
    users {
        id
    }
}

query allUserGroups {
    allUserGroups { results { __typename, ...UserGroup } }
}

# Update email

mutation updateCurrentUserEmail(
    $email: String!
) {
    currentUserUpdate(input: {
        email: $email
    }) {
        errors {
            field
            messages
        }
    }
}


# Update password
mutation updateCurrentUserPassword(
    $oldPassword: String!
    $newPassword: String!
) {
    userUpdatePassword(
        input: {
            oldPassword: $oldPassword
            newPassword: $newPassword
        }
    ) {
        errors {
            field
            messages
        }
    }
}
