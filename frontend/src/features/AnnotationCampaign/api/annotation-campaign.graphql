fragment AllCampaign on AnnotationCampaignNode {
    id
    name
    deadline
    archived
    datasetName
    phases {
        results {
            phase
            archived
            userTasksCount
            userCompletedTasksCount
        }
    }
    tasksCount
    completedTasksCount
}

query allCampaigns(
    $search: String
    $filter_isArchived: Boolean
    $filter_phase: AnnotationPhaseType
    $filter_ownerID: ID
    $filter_annotatorID: ID
) {
    allAnnotationCampaigns(
        archived: $filter_isArchived
        phases_Phase: $filter_phase
        ownerId: $filter_ownerID
        phases_AnnotationFileRanges_AnnotatorId: $filter_annotatorID
        search: $search

        orderBy: "name"
    ) {
        results { ...AllCampaign }
    }
}

fragment CampaignAnalysis on SpectrogramAnalysisNode {
    id
    name
    colormap {
        name
    }
    fft {
        nfft
        windowSize
        overlap
        samplingFrequency
    }
    frequencyScaleParts {
        ratio
        minValue
        maxValue
    }
    legacyConfiguration {
        zoomLevel
    }
    legacy
}

fragment LabelRelation on AnnotationCampaignLabelNode {
    id
    label {
        id
        displayName
        source {
            englishName
        }
    }
    enableAcousticFeatures
}

fragment Campaign on AnnotationCampaignNode {
    id
    name
    createdAt
    instructionsUrl
    deadline
    archived
    archivedAt
    archivedBy {
        displayName
    }
    hasChangePermission
    allowPointAnnotation
    allowColormapTuning
    allowImageTuning
    colormapDefault
    colormapInvertedDefault
    allowDigitalZoom
    dataset {
        id
        name
        archived
    }
    owner {
        id
        displayName
        email
    }
    description
    confidenceSet {
        id
        name
        desc
        confidenceIndicators {
            id
            label
            isDefault
        }
    }
    detectors {
        id
        name
    }
    annotators {
        id
        displayName
    }
    analysis {
        edges {
            node { ...CampaignAnalysis }
        }
    }
    spectrogramsCount
    phases {
        results {
            id
            phase
            archived
            hasChangePermission
            tasksCount
            completedTasksCount
        }
    }
}

query getCampaign($id: ID!) {
    annotationCampaignById(id: $id) { ...Campaign }
}
query getCampaignLabels($id: ID!) {
    annotationCampaignById(id: $id) { labels { ...LabelRelation } }
}

mutation createCampaign(
    $name: String!
    $description: String
    $instructionsUrl: String
    $deadline: Date
    $allowImageTuning: Boolean
    $allowColormapTuning: Boolean
    $colormapDefault: String
    $colormapInvertedDefault: Boolean
    $allowDigitalZoom: Boolean
    $datasetID: ID!
    $analysisIDs: [ID]!
) {
    createAnnotationCampaign(input: {
        name: $name
        description: $description
        instructionsUrl: $instructionsUrl
        deadline: $deadline
        allowImageTuning: $allowImageTuning
        allowColormapTuning: $allowColormapTuning
        colormapDefault: $colormapDefault
        colormapInvertedDefault: $colormapInvertedDefault
        allowDigitalZoom: $allowDigitalZoom
        dataset: $datasetID
        analysis: $analysisIDs
    }) {
        annotationCampaign {
            id
            dataset {
                path
            }
        }
        errors {
            field
            messages
        }
    }
}

mutation archiveCampaign($id: ID!) {
    archiveAnnotationCampaign(id: $id) {
        ok
        error {
            field
            messages
        }
    }
}

mutation updateCampaignLabelAcousticFeatures(
    $relationId: ID!
    $enableAcousticFeatures: Boolean!
) {
    updateAnnotationCampaignLabelAcousticFeatures(
        input: {
            id: $relationId,
            enableAcousticFeatures: $enableAcousticFeatures
        }
    ) {
        errors {
            field
            messages
        }
    }
}
