fragment BaseCampaign on AnnotationCampaignNode {
    id
    name
    deadline
    isArchived
    datasetName
    phases {
        results {
            phase
            isOpen
            userTasksCount
            userCompletedTasksCount
        }
    }
    tasksCount
    completedTasksCount
}

query allCampaigns(
    $search: String
    $filter_isArchived: Boolean
    $filter_phase: AnnotationPhaseType
    $filter_ownerID: ID
    $filter_annotatorID: ID
) {
    allAnnotationCampaigns(
        isArchived: $filter_isArchived
        phases_Phase: $filter_phase
        ownerId: $filter_ownerID
        phases_AnnotationFileRanges_AnnotatorId: $filter_annotatorID
        search: $search

        orderBy: "name"
    ) {
        results { ...BaseCampaign }
    }
}

fragment CampaignAnalysis on SpectrogramAnalysisNode {
    id
    name
    colormap {
        name
    }
    fft {
        nfft
        windowSize
        overlap
        samplingFrequency
    }
    frequencyScaleParts {
        ratio
        minValue
        maxValue
    }
    legacyConfiguration {
        zoomLevel
    }
    legacy
}

query getCampaign($id: ID!) {
    annotationCampaignById(id: $id) {
        id
        name
        createdAt
        instructionsUrl
        deadline
        isArchived
        isEditable
        isUserAllowedToManage
        allowPointAnnotation
        allowColormapTuning
        allowImageTuning
        colormapDefault
        colormapInvertedDefault
        allowNumericZoom
        dataset {
            id
            name
        }
        labelSet {
            id
            name
            description
            labels {
                id
                name
            }
        }
        labelsWithAcousticFeatures {
            id
            name
        }
        owner {
            id
            displayName
            email
        }
        description
        archive {
            date
            byUser {
                displayName
            }
        }
        confidenceSet {
            id
            name
            desc
            confidenceIndicators {
                id
                label
                isDefault
            }
        }
        detectors {
            id
            name
        }
        annotators {
            id
            displayName
        }
        analysis {
            edges {
                node { ...CampaignAnalysis }
            }
        }
        spectrogramsCount
        phases {
            results {
                id
                phase
                isOpen
                tasksCount
                completedTasksCount
            }
        }
    }
}

mutation createCampaign(
    $name: String!
    $description: String
    $instructionsUrl: String
    $deadline: Date
    $allowImageTuning: Boolean
    $allowColormapTuning: Boolean
    $colormapDefault: String
    $colormapInvertedDefault: Boolean
    $allowNumericZoom: Boolean
    $datasetID: ID!
    $analysisIDs: [ID]!
) {
    createAnnotationCampaign(input: {
        name: $name
        description: $description
        instructionsUrl: $instructionsUrl
        deadline: $deadline
        allowImageTuning: $allowImageTuning
        allowColormapTuning: $allowColormapTuning
        colormapDefault: $colormapDefault
        colormapInvertedDefault: $colormapInvertedDefault
        allowNumericZoom: $allowNumericZoom
        dataset: $datasetID
        analysis: $analysisIDs
    }) {
        annotationCampaign {
            id
            dataset {
                path
            }
        }
        errors {
            field
            messages
        }
    }
}

mutation archiveCampaign($id: ID!) {
    archiveAnnotationCampaign(id: $id) {
        ok
    }
}

mutation updateCampaignFeaturedLabels(
    $id: ID!
    $labelsWithAcousticFeatures: [ID]!
    $labelSetID: ID!
    $confidenceSetID: ID
    $allowPointAnnotation: Boolean!
) {
    updateAnnotationCampaign(input: {
        id: $id
        allowPointAnnotation: $allowPointAnnotation
        labelsWithAcousticFeatures: $labelsWithAcousticFeatures
        labelSet: $labelSetID
        confidenceSet: $confidenceSetID
    }) {
        errors {
            field
            messages
        }
    }
}
