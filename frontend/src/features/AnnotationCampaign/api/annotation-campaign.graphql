query allCampaigns(
    $search: String
    $filter_isArchived: Boolean
    $filter_phase: AnnotationPhaseType
    $filter_ownerID: ID
    $filter_annotatorID: ID
    $filter_datasetID: ID
) {
    allAnnotationCampaigns(
        isArchived: $filter_isArchived
        phases_Phase: $filter_phase
        ownerId: $filter_ownerID
        phases_AnnotationFileRanges_AnnotatorId: $filter_annotatorID
        search: $search
        analysis_DatasetId: $filter_datasetID

        orderBy: "name"
    ) {
        results {
            id
            name
            deadline
            isArchived
            datasetName
            phases {
                results {
                    phase
                }
            }
            tasksCount
            completedTasksCount
            userTasksCount
            userCompletedTasksCount
        }
    }
}

query getCampaign($id: ID!) {
    annotationCampaignById(id: $id) {
        id
        name
        createdAt
        instructionsUrl
        deadline
        isArchived
        isEditable
        isUserAllowedToManage
        allowPointAnnotation
        allowColormapTuning
        allowImageTuning
        colormapDefault
        colormapInvertedDefault
        dataset {
            id
            name
        }
        labelSet {
            id
            name
            description
            labels {
                id
                name
            }
        }
        labelsWithAcousticFeatures {
            id
            name
        }
        owner {
            id
            displayName
            email
        }
        description
        archive {
            date
            byUser {
                displayName
            }
        }
        confidenceSet {
            id
            name
            desc
            confidenceIndicators {
                label
                isDefault
            }
        }
        detectors {
            id
            name
        }
        annotators {
            id
            displayName
        }
        analysis {
            edges {
                node {
                    id
                    name
                    colormap {
                        name
                    }
                    fft {
                        nfft
                        windowSize
                        overlap
                        samplingFrequency
                    }
                    frequencyScaleParts {
                        ratio
                        minValue
                        maxValue
                    }
                    legacyConfiguration {
                        zoomLevel
                    }
                    legacy
                }
            }
        }
        spectrogramsCount
        phases {
            results {
                id
                phase
                isOpen
                tasksCount
                completedTasksCount
            }
        }
    }
}
