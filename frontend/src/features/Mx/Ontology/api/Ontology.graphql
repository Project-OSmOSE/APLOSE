# Source
fragment Source on SourceNode {
    __typename
    id
    preferredDisplay
    parent { id }
}
fragment DetailedSource on SourceNode {
    ...Source
    englishName
    latinName
    frenchName
    codeName
    taxon
}

query allSources{
    allSources { results { ...Source } }
}
query detailedSourceByID($id: ID!){
    sourceById(id: $id) { ...DetailedSource }
}
mutation postSource($input: PostSourceMutationInput!) {
    postSource(input: $input) {
        source { ...DetailedSource }
        errors { field, messages }
    }
}
mutation deleteSource($id: ID!) {
    deleteSource(id: $id) { ok }
}

# Sound
fragment Sound on SoundNode {
    __typename
    id
    preferredDisplay
    parent { id }
}
fragment DetailedSound on SoundNode {
    ...Sound
    englishName
    frenchName
    codeName
    taxon
