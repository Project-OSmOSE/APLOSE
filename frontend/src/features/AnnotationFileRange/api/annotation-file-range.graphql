fragment FileRange on AnnotationFileRangeNode {
    id
    firstFileIndex
    lastFileIndex
    filesCount

    annotator {
        id
        displayName
    }

    completedAnnotationTasks: annotationTasks(status: Finished) {
        totalCount
    }
}

query fileRangesForPhase(
    $campaignID: ID!
    $phaseType: AnnotationPhaseType!
) {
    allAnnotationFileRanges(
        annotationPhase_AnnotationCampaign: $campaignID
        annotationPhase_Phase: $phaseType
    ) {
        results { ...FileRange }
    }
}

mutation updateFileRanges(
    $campaignID: ID!
    $phaseType: AnnotationPhaseType!
    $fileRanges: [AnnotationFileRangeInput!]!
    $force: Boolean
) {
    updateAnnotationPhaseFileRanges(
        campaignId: $campaignID
        phaseType: $phaseType
        fileRanges: $fileRanges
        force: $force
    ) {
        errors {
            messages
            field
        }
    }
}

query getFileRanges($phase: ID!, $annotator: ID!) {
    allAnnotationFileRanges(
        annotationPhase: $phase,
        annotator: $annotator,
        orderBy: "firstFileIndex"
    ) {
        results { ...FileRange }
    }
}



query listFileRanges($phaseID: ID) {
    allAnnotationFileRanges(annotationPhase: $phaseID) {
        results { ...FileRange }
    }
}

mutation createFileRange($input: AnnotationFileRangeCreateMutationInput!) {
    createFileRange(input: $input) {
        annotationFileRange { ...FileRange }
        errors {
            messages
            field
        }
    }
}

mutation updateFileRange($input: AnnotationFileRangeUpdateMutationInput!) {
    updateFileRange(input: $input) {
        annotationFileRange { ...FileRange }
        errors {
            field
            messages
        }
    }
}

mutation deleteFileRange($id: ID!, $force: Boolean) {
    deleteFileRange(id: $id, force: $force) {
        error {
            field
            messages
        }
    }
}
