query getAnnotationPhase(
    $campaignID: ID!
    $phase: AnnotationPhaseType!
) {
    annotationPhaseByCampaignPhase(
        campaignId: $campaignID
        phaseType: $phase
    ) {
        id
        phase
        isEditable
        isUserAllowedToManage
        endedAt
        hasAnnotations
        tasksCount
        completedTasksCount
        userTasksCount
        userCompletedTasksCount
    }
}

mutation endPhase($id: ID!) {
    endAnnotationPhase(id: $id) {
        ok
    }
}
