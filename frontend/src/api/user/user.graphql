
mutation updateCurrentUserPassword(
    $oldPassword: String!
    $newPassword: String!
) {
    userUpdatePassword(
        input: {
            oldPassword: $oldPassword
            newPassword: $newPassword
        }
    ) {
        errors {
            field
            messages
        }
    }
}

mutation updateCurrentUserEmail(
    $email: String!
) {
    currentUserUpdate(input: {
        email: $email
    }) {
        errors {
            field
            messages
        }
    }
}
