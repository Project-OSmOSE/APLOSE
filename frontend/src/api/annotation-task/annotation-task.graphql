query getAnnotationTask(
    $spectrogramID: ID!
    $annotatorID: ID!
    $campaignID: ID!
    $analysisID: ID!
    $phaseType: AnnotationPhaseType!

    # Filtering
    $search: String
    $status: AnnotationTaskStatus
    $from: DateTime
    $to: DateTime

    $onlyAssigned: Boolean
    $withAnnotations: Boolean
    $annotationLabel: String
    $annotationConfidence: String
    $annotationDetector: ID
    $annotationAnnotator: ID
    $withAcousticFeatures: Boolean
) {
    spectrogramPaths(spectrogramId: $spectrogramID, analysisId: $analysisID) {
        audioPath
        spectrogramPath
    }
    annotationSpectrogramById(id: $spectrogramID) {
        id
        filename
        start
        duration

        isAssigned(phase: $phaseType, campaignId: $campaignID)

        task(
            phase: $phaseType
            campaignId: $campaignID
        ) {
            status

            userComments(
                author: $annotatorID,
                annotationPhase_Phase: $phaseType
            ) {
                results {
                    id
                    comment
                }
            }

            userAnnotations {
                results {
                    id
                    annotationPhase {
                        id
                    }
                    type
                    startTime
                    endTime
                    startFrequency
                    endFrequency
                    label {
                        name
                    }
                    confidence {
                        label
                    }
                    detectorConfiguration {
                        id
                        detector {
                            id
                            name
                        }
                    }
                    annotator {
                        id,
                        displayName
                    }
                    comments(author: $annotatorID) {
                        results{
                            id
                            comment
                        }
                    }
                    validations(annotator: $annotatorID) {
                        results {
                            id
                            isValid
                        }
                    }
                    isUpdateOf {
                        id
                    }
                    acousticFeatures {
                        id
                        isIntensityTooLow
                        doesOverlapOtherSignals
                        startFrequency
                        endFrequency
                        relativeMinFrequencyCount
                        relativeMaxFrequencyCount
                        stepsCount
                        hasHarmonics
                        trend
                        hasSidebands
                        hasSubharmonics
                        hasFrequencyJumps
                        frequencyJumpsCount
                        hasDeterministicChaos
                    }
                }
            }
            annotationsToCheck {
                results {
                    id
                    annotationPhase {
                        id
                    }
                    type
                    startTime
                    endTime
                    startFrequency
                    endFrequency
                    label {
                        name
                    }
                    confidence {
                        label
                    }
                    detectorConfiguration {
                        id
                        detector {
                            id
                            name
                        }
                    }
                    annotator {
                        id,
                        displayName
                    }
                    comments(author: $annotatorID) {
                        results{
                            id
                            comment
                        }
                    }
                    validations(annotator: $annotatorID) {
                        results {
                            id
                            isValid
                        }
                    }
                    isUpdateOf {
                        id
                    }
                    acousticFeatures {
                        id
                        isIntensityTooLow
                        doesOverlapOtherSignals
                        startFrequency
                        endFrequency
                        relativeMinFrequencyCount
                        relativeMaxFrequencyCount
                        stepsCount
                        hasHarmonics
                        trend
                        hasSidebands
                        hasSubharmonics
                        hasFrequencyJumps
                        frequencyJumpsCount
                        hasDeterministicChaos
                    }
                }
            }
        }
    }

    allAnnotationSpectrograms(
        # Sort
        orderBy: "start"

        # Only assigned
        annotator: $annotatorID
        annotationCampaign: $campaignID
        phase: $phaseType
        onlyAssigned: $onlyAssigned

        # Search
        filename_Icontains: $search

        # Dates filters
        end_Gte: $from
        start_Lte: $to

        # Task filters
        annotationTasks_Status: $status

        # Annotation filters
        annotations_Exists: $withAnnotations
        annotations_LabelName: $annotationLabel
        annotations_Confidence_Label: $annotationConfidence
        annotations_Detector: $annotationDetector
        annotations_Annotator: $annotationAnnotator
        annotations_AcousticFeatures_Exists: $withAcousticFeatures
    ) {
        currentIndex(spectrogramId: $spectrogramID)
        totalCount
        previousSpectrogramId(spectrogramId: $spectrogramID)
        nextSpectrogramId(spectrogramId: $spectrogramID)
    }
}

mutation submitTask (
    $campaignID: ID!
    $spectrogramID: ID!
    $phase: AnnotationPhaseType!
    $annotations: [AnnotationInput]!
    $taskComments: [AnnotationCommentInput]!

    $startedAt: DateTime!
    $endedAt: DateTime!
) {
    submitAnnotationTask(
        spectrogramId: $spectrogramID
        phaseType: $phase
        campaignId: $campaignID
        startedAt: $startedAt
        endedAt: $endedAt
        annotations: $annotations
        taskComments: $taskComments
    ) {
        ok
        annotationErrors {
            field
            messages
        }
        taskCommentsErrors {
            field
            messages
        }
    }
}
