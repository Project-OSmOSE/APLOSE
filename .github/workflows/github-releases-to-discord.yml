name: Notify Discord on Release

on:
  release:
    types: [released,]
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:
    inputs:
      release_name:
        description: Release title to post
        required: true
      release_body:
        description: Release notes body to post
        required: true
      release_html_url:
        description: Release URL to link in Discord
        required: false

jobs:
  github-releases-to-discord:
    runs-on: ubuntu-latest
    steps:
      - name: GitHub Releases to OSmOSE Discord
        uses: SethCohen/github-releases-to-discord@v1
        with:
          webhook_url: ${{ secrets.OSMOSE_WEBHOOK_URL }}
          username: "APLOSE Release"
          avatar_url: "https://github.com/Project-OSmOSE/APLOSE/blob/master/frontend/public/images/logo/x96.png"
