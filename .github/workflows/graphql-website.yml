name: GraphQL Codegen Check
on:
  push:
    paths:
      - 'backend/**'
      - 'website/**/*.graphql'
      - 'website/codegen.ts'
      - 'pyproject.toml'
      - 'poetry.lock'
    branches: [ main, master ]
  pull_request:
    paths:
      - 'backend/**'
      - 'website/**/*.graphql'
      - 'website/codegen.ts'
      - 'pyproject.toml'
      - 'poetry.lock'
    types: [ ready_for_review, opened, reopened, synchronize ]

jobs:
  check-graphql-codegen:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ── Schema generation (Python) ──────────────────────────────────────
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Poetry
        run: pip install poetry

      - name: Install Python dependencies
        run: poetry install --only main --no-root

      - name: Generate GraphQL website schema
        env:
          ENV: build
        run: |
          poetry run python ./manage.py graphql_schema \
            --schema backend.schema.schema \
            --out website/schema.graphql

      # ── Codegen TypeScript /website ─────────────────────────────────────────────────
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: website/package-lock.json

      - name: Install Node dependencies
        working-directory: website
        run: npm ci

      - name: Run GraphQL codegen
        working-directory: website
        run: npm run graphql:generate

      - name: Typescript compilation
        working-directory: website
        run: npx tsc
